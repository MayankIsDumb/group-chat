plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'MaxHenkel'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// ./gradlew runClient -PgcHeap=900M trims the heap on low memory machines
			vmArg "-Xmx${project.findProperty('gcHeap') ?: '1500M'}"
			// ./gradlew runClient -PgcDevtools=true runs the scripted UI smoke test
			property("groupchat.devtools", (project.findProperty("gcDevtools") ?: "false").toString())
			// ./gradlew runClient -PgcDevtools=true -PgcConnect=127.0.0.1:25565 joins a server
			property("groupchat.devtools.connect", (project.findProperty("gcConnect") ?: "").toString())
			property("groupchat.devtools.voicetest", (project.findProperty("gcVoiceTest") ?: "false").toString())
			property("groupchat.devtools.agent", (project.findProperty("gcAgent") ?: "").toString())
		}
		server {
			vmArg "-Xmx700M"
		}
	}

	mods {
		"groupchat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional Mod Menu integration: compile against it and load it in dev for the config screen.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Optional Simple Voice Chat integration.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.27"
	modLocalRuntime "maven.modrinth:simple-voice-chat:arpQQSyx"
}

processResources {
	from('LICENSE')
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Minecraft 1.21.11 targets Java 21. Pin the toolchain so the game runs on JDK 21
	// even when Gradle itself is started with a newer JDK.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

